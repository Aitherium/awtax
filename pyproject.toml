[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awtax"
version = "0.1.0"
description = "Turn any tax PDF -- returns, W-2, 1099, statements, even scans -- into structured data you can check."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aitherium" }]
keywords = ["tax", "pdf", "extraction", "ocr", "1040", "w-2", "aither-world"]
dependencies = [
    "pymupdf>=1.24",
]

[project.optional-dependencies]
# Scanned pages read best through the aw* vision brick; tesseract is the offline fallback.
vision = ["awvision>=0.1"]
ocr = []  # tesseract is a system binary, not a pip dep -- documented in README

[project.scripts]
awtax = "awtax.cli:main"

[project.urls]
Homepage = "https://github.com/Aitherium/awtax"

[tool.setuptools.packages.find]
where = ["."]
include = ["awtax*"]
